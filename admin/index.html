function addMcpServer() { openMcpForm(null); }
function editMcpServer(s) { openMcpForm(s); }

function openMcpForm(existing) {
  const e = existing || {};
  const isEdit = !!existing;
  const kw = e.tool_keywords && Object.keys(e.tool_keywords).length
    ? JSON.stringify(e.tool_keywords, null, 2) : '';
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h3>${isEdit?'Edit':'Add'} MCP server</h3>
        <button class="close-btn" onclick="this.closest('.modal-bg').remove()">×</button>
      </div>
      <div class="modal-body">
        <label>Name (id)</label>
        <input id="m-name" value="${escapeHtml(e.name||'')}" ${isEdit?'readonly':''}
               placeholder="e.g. land_records" pattern="[a-zA-Z0-9_-]+">
        <small style="color:#9ca3af">Letters, numbers, <code>_</code> and <code>-</code> only — spaces become <code>_</code>.</small>
        <label style="margin-top:10px">Server URL</label>
        <input id="m-url" value="${escapeHtml(e.url||'')}" placeholder="https://host.gov.in/mcp">
        <label style="margin-top:10px">Transport</label>
        <select id="m-transport">
          <option value="streamable_http" ${e.transport!=='sse'?'selected':''}>streamable_http</option>
          <option value="sse" ${e.transport==='sse'?'selected':''}>sse</option>
        </select>
        <label style="margin-top:10px">Auth token env var (optional)</label>
        <input id="m-auth" value="${escapeHtml(e.auth_token_env||'')}" placeholder="e.g. LAND_RECORDS_MCP_TOKEN">
        <label style="margin-top:10px"><input type="checkbox" id="m-enabled" ${e.enabled!==false?'checked':''}> Enabled</label>
        <label style="margin-top:10px">Tool keywords (optional JSON — makes remote tools chat-reachable)</label>
        <textarea id="m-kw" rows="4" placeholder='{"land_record_status": ["mutation status", "name transfer"]}'
                  style="font-family:monospace;font-size:12px">${escapeHtml(kw)}</textarea>
        <div id="m-probe" style="margin-top:10px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="testMcpConnection(this)">Test connection</button>
        <button class="btn btn-secondary" onclick="this.closest('.modal-bg').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="saveMcpServer(this)">Save &amp; connect</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function readMcpForm(btn) {
  const m = btn.closest('.modal-bg');
  let tool_keywords = {};
  const kwRaw = m.querySelector('#m-kw').value.trim();
  if (kwRaw) {
    try { tool_keywords = JSON.parse(kwRaw); }
    catch (e) { alert('Tool keywords must be valid JSON'); return null; }
  }
  // Normalise the name into a valid id: spaces -> underscore, drop the rest.
  const name = m.querySelector('#m-name').value.trim()
    .replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_-]/g, '');
  return {
    m,
    body: {
      name,
      url: m.querySelector('#m-url').value.trim(),
      transport: m.querySelector('#m-transport').value,
      auth_token_env: m.querySelector('#m-auth').value.trim(),
      enabled: m.querySelector('#m-enabled').checked,
      tool_keywords,
    },
  };
}

async function testMcpConnection(btn) {
  const f = readMcpForm(btn); if (!f) return;
  const out = f.m.querySelector('#m-probe');
  if (!f.body.url) { out.innerHTML = '<small style="color:#b91c1c">Enter a URL first.</small>'; return; }
  out.innerHTML = '<small style="color:#6b7280">Connecting…</small>';
  try {
    const r = await fetchJson('/mcp/test', {
      method: 'POST', body: JSON.stringify({
        url: f.body.url, transport: f.body.transport, auth_token_env: f.body.auth_token_env }),
    });
    if (r.ok) {
      out.innerHTML = `<div style="background:#dcfce7;border:1px solid #86efac;border-radius:6px;padding:8px;font-size:12px">
        <strong>✓ Connected.</strong> ${r.count} tool(s): ${r.tools.map(t=>`<code>${escapeHtml(t.name)}</code>`).join(', ')}</div>`;
    } else {
      out.innerHTML = `<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;padding:8px;font-size:12px">
        <strong>✗ Failed:</strong> ${escapeHtml(r.error||'unknown error')}</div>`;
    }
  } catch (e) { out.innerHTML = `<small style="color:#b91c1c">Test failed: ${escapeHtml(e.message)}</small>`; }
}

async function saveMcpServer(btn) {
  const f = readMcpForm(btn); if (!f) return;
  if (!f.body.name || !f.body.url) { alert('Name and URL are required'); return; }
  try {
    const r = await fetchJson('/mcp/servers', { method: 'PUT', body: JSON.stringify(f.body) });
    const st = (r.server && r.server.connected)
      ? `connected, ${r.server.tools.length} tool(s)` : `saved but not connected${r.server&&r.server.error?` (${r.server.error})`:''}`;
    toast(`MCP server '${f.body.name}': ${st}`);
    f.m.remove();
    renderTools(document.getElementById('content'));
  } catch (e) { alert(`Save failed: ${e.message}`); }
}

async function deleteMcpServer(name) {
  if (!confirm(`Delete MCP server '${name}'? Its tools will be removed from the registry.`)) return;
  try {
    await fetchJson(`/mcp/servers/${encodeURIComponent(name)}`, { method: 'DELETE' });
    toast(`Deleted MCP server '${name}'`);
    renderTools(document.getElementById('content'));
  } catch (e) { alert(`Delete failed: ${e.message}`); }
}

function toast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#075E54;color:#fff;padding:12px 18px;border-radius:8px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:13px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ===== SKILLS =====
// A skill bundles tools + an instruction fragment (+ optional RAG corpus) that
// an agent gains as a unit. WHAT it is lives in data/skills/<id>.json; WHICH
// agents get it lives in data/skill_bindings.json — edited here, effective next turn.
let cachedSkills = [];
let skillFilter = { q: '', source: 'all', attention: false };

// A skill "needs attention" when it references tools not in the registry
// (e.g. its MCP server isn't connected yet).
function _skillAttention(s) {
  const reasons = [];
  if ((s.missing_tools || []).length) reasons.push(`${s.missing_tools.length} tool(s) not in registry`);
  return reasons;
}

async function renderSkills(root) {
  try {
    const [sj, aj, tj] = await Promise.all([
      fetchJson('/skills'), fetchJson('/agents'), fetchJson('/tools'),
    ]);
    cachedSkills = sj.skills;
    cachedAgents = aj.agents;
    const agentIds = aj.agents.map(a => a.id);
    window._skillToolChoices = tj.tools.map(t => t.id);

    const wired = sj.skills.filter(s => (s.agents || []).length).length;
    const attentionCount = sj.skills.filter(s => _skillAttention(s).length).length;

    const agentPills = (s) => agentIds.map(aid => {
      const on = (s.agents || []).includes(aid);
      return `<label class="agent-pill ${on?'on':''}">
        <input type="checkbox" data-skill="${s.id}" data-agent="${aid}" ${on?'checked':''}
               onchange="onSkillAgentToggle(this)"> ${aid}</label>`;
    }).join('');

    const rowFor = (s) => {
      const onCount = (s.agents || []).filter(a => agentIds.includes(a)).length;
      const reasons = _skillAttention(s);
      const miss = s.missing_tools || [];
      const search = escapeHtml(`${s.name} ${s.id} ${s.description||''}`.toLowerCase());
      const toolChips = (s.tool_ids || []).map(tid => {
        const bad = miss.includes(tid);
        return `<code style="background:${bad?'#fee2e2':'#f3f4f6'};padding:1px 6px;border-radius:3px;margin:0 4px 4px 0;display:inline-block" title="${bad?'not in registry yet (MCP not connected?)':''}">${escapeHtml(tid)}</code>`;
      }).join('') || '<small style="color:#9ca3af">no tools</small>';
      return `
      <details class="tool-item skill-item ${s.enabled?'':'disabled'}" id="skillrow-${cssId(s.id)}"
               data-search="${search}" data-source="${s.source||'builtin'}"
               data-attention="${reasons.length?'1':'0'}">
        <summary class="tool-summary">
          <span onclick="event.stopPropagation()">
            <label class="agent-toggle" title="${s.enabled?'Enabled — click to disable':'Disabled — click to enable'}">
              <input type="checkbox" data-skill-enable="${s.id}" ${s.enabled?'checked':''}
                     onchange="toggleSkillEnabled(this, '${jsAttr(s.id)}')">
              <span class="agent-toggle-slider"></span>
            </label>
          </span>
          <span class="ts-main">
            <span class="ts-name">${escapeHtml(s.name)}</span> ${SOURCE_BADGE[s.source]||''}
            ${reasons.length ? `<span class="tag tag-rejected" title="${escapeHtml(reasons.join('; '))}">⚠ ${miss.length} tool(s) missing</span>`:''}
            <br><span class="ts-id">${escapeHtml(s.id)}</span>
          </span>
          <span class="tool-chip-count ${onCount===0?'none':''}">${onCount} / ${agentIds.length} agents</span>
          <span class="tool-chevron">▶</span>
        </summary>
        <div class="tool-detail">
          <div class="tool-desc">${escapeHtml((s.description||'').slice(0,240)) || 'No description.'}</div>
          <div style="margin-bottom:10px">${toolChips}</div>
          ${s.corpus_id ? `<div style="font-size:12px;color:#6b7280;margin-bottom:10px">📚 RAG corpus: <code>${escapeHtml(s.corpus_id)}</code></div>`:''}
          ${reasons.length ? `<div class="tool-warn">⚠ ${reasons.map(escapeHtml).join(' · ')} — connect the MCP server or fix the tool id.</div>`:''}
          <div class="agent-grid">${agentPills(s)}</div>
          <div class="tool-detail-actions">
            <button class="btn btn-primary btn-sm" data-skill-save="${s.id}" onclick="saveSkillBinding('${jsAttr(s.id)}')">Save wiring</button>
            <button class="btn btn-secondary btn-sm" onclick='editSkill(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteSkill('${jsAttr(s.id)}')">Delete</button>
            ${(!s.binding) ? `<small style="color:#9ca3af;margin-left:4px">using author defaults</small>`:''}
            <span class="agent-select-helpers">
              <a onclick="setAllSkillAgents('${jsAttr(s.id)}', true)">Select all</a> ·
              <a onclick="setAllSkillAgents('${jsAttr(s.id)}', false)">Clear</a>
            </span>
          </div>
        </div>
      </details>`;
    };

    const chip = (val, label) =>
      `<button class="chip ${skillFilter.source===val?'on':''}" data-sksrc="${val}" onclick="setSkillFilterSource('${val}')">${label}</button>`;

    root.innerHTML = `
      <div class="card">
        <div class="card-header">
          <h2>Skills <span style="color:#9ca3af;font-weight:600">(${sj.skills.length} · ${wired} wired${attentionCount?` · <span style="color:#b91c1c">${attentionCount} need attention</span>`:''})</span>${sj.enabled?'':' <span class="tag tag-mock">disabled (SKILLS_ENABLED=false)</span>'}</h2>
          <div>
            <button class="btn btn-primary btn-sm" onclick="addSkill()">+ Add skill</button>
            <button class="btn btn-primary btn-sm" onclick="uploadSkillDialog()" title="Upload a skill folder or .zip — validated, then attached and wired to agents">⬆ Upload skill</button>
            <button class="btn btn-primary btn-sm" onclick="openCallbackBuilder(null)" title="Build an outbound callback agent (RAG + MCP + skill), no code">📞 + Callback agent</button>
            <button class="btn btn-secondary btn-sm" onclick="reloadSkills()" title="Re-scan data/skills/">⟳ Reload</button>
          </div>
        </div>
        <div class="card-body" style="font-size:13px;color:#6b7280">
          A skill bundles existing tools with an instruction fragment (and optional RAG corpus).
          Expand one to wire it to agents; its tools appear to those agents alongside their own,
          and its instructions are injected into the system prompt. Saves to <code>data/skills/</code>
          + <code>data/skill_bindings.json</code>, effective next chat turn.
          ${SOURCE_BADGE.builtin} shipped · ${SOURCE_BADGE.external} added here.
          <div class="tool-filter-row">
            <div class="tool-filter-chips">
              ${chip('all','All')} ${chip('builtin','Built-in')} ${chip('external','External')}
              <button id="chip-sk-attn" class="chip ${skillFilter.attention?'on':''}" onclick="toggleSkillAttention()">⚠ Needs attention${attentionCount?` (${attentionCount})`:''}</button>
            </div>
            <input class="tools-search" placeholder="🔎 Filter by name, id or description…" value="${escapeHtml(skillFilter.q)}" oninput="filterSkills(this.value)">
          </div>
        </div>
      </div>
      <div class="card tool-cat" id="skill-cat">
        <div class="card-body">
          ${sj.skills.map(rowFor).join('') || '<div class="empty">No skills yet. Click “Add skill”.</div>'}
        </div>
      </div>`;
    applySkillFilter();
  } catch (e) { root.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

function collectSkillBinding(skillId) {
  const enabled = document.querySelector(`input[data-skill-enable="${CSS.escape(skillId)}"]`).checked;
  const agents = [...document.querySelectorAll(`input[data-skill="${CSS.escape(skillId)}"]:checked`)]
    .map(el => el.getAttribute('data-agent'));
  return { enabled, agents };
}

// Save wiring in place (keep the open row); mirror of saveToolBinding.
async function saveSkillBinding(skillId) {
  try {
    const body = collectSkillBinding(skillId);
    await fetchJson(`/skills/${encodeURIComponent(skillId)}/binding`, {
      method: 'PUT', body: JSON.stringify(body),
    });
    const s = cachedSkills.find(x => x.id === skillId);
    if (s) { s.agents = body.agents; s.enabled = body.enabled; s.binding = true; }
    markSkillDirty(skillId, false);
    updateSkillChip(skillId);
    toast(`Saved ${skillId}: ${body.agents.length} agent(s)`);
  } catch (e) { alert(`Save failed: ${e.message}`); }
}

// Master enable/disable — auto-saves, preserving the saved agent list.
async function toggleSkillEnabled(el, skillId) {
  const enabled = el.checked;
  const item = el.closest('.tool-item');
  item.classList.toggle('disabled', !enabled);
  const s = cachedSkills.find(x => x.id === skillId);
  const agents = (s && Array.isArray(s.agents)) ? s.agents : collectSkillBinding(skillId).agents;
  try {
    await fetchJson(`/skills/${encodeURIComponent(skillId)}/binding`, {
      method: 'PUT', body: JSON.stringify({ enabled, agents }) });
    if (s) { s.enabled = enabled; s.binding = true; }
    toast(`${s ? s.name : skillId} — skill ${enabled ? 'enabled' : 'disabled'}`);
  } catch (e) {
    el.checked = !enabled; item.classList.toggle('disabled', enabled);
    alert(`Failed to ${enabled ? 'enable' : 'disable'} ${skillId}: ${e.message}`);
  }
}

function onSkillAgentToggle(el) {
  el.closest('.agent-pill').classList.toggle('on', el.checked);
  const id = el.getAttribute('data-skill');
  updateSkillChip(id);
  markSkillDirty(id, true);
}
function updateSkillChip(skillId) {
  const det = document.getElementById('skillrow-' + cssId(skillId));
  if (!det) return;
  const total = det.querySelectorAll('.agent-pill input').length;
  const on = det.querySelectorAll('.agent-pill input:checked').length;
  const chip = det.querySelector('.tool-chip-count');
  if (chip) { chip.textContent = `${on} / ${total} agents`; chip.classList.toggle('none', on === 0); }
}
function setAllSkillAgents(skillId, on) {
  const det = document.getElementById('skillrow-' + cssId(skillId));
  if (!det) return;
  det.querySelectorAll('.agent-pill input').forEach(i => {
    i.checked = on; i.closest('.agent-pill').classList.toggle('on', on);
  });
  updateSkillChip(skillId);
  markSkillDirty(skillId, true);
}
function markSkillDirty(skillId, dirty) {
  const det = document.getElementById('skillrow-' + cssId(skillId));
  if (!det) return;
  det.classList.toggle('dirty', dirty);
  const btn = det.querySelector(`[data-skill-save="${CSS.escape(skillId)}"]`);
  if (btn) btn.textContent = dirty ? 'Save wiring •' : 'Save wiring';
}

// ---- skill filtering (source chips + needs-attention + text) ----
function setSkillFilterSource(src) {
  skillFilter.source = src;
  document.querySelectorAll('.tool-filter-chips .chip[data-sksrc]').forEach(c =>
    c.classList.toggle('on', c.getAttribute('data-sksrc') === src));
  applySkillFilter();
}
function toggleSkillAttention() {
  skillFilter.attention = !skillFilter.attention;
  const b = document.getElementById('chip-sk-attn');
  if (b) b.classList.toggle('on', skillFilter.attention);
  applySkillFilter();
}
function filterSkills(q) { skillFilter.q = q || ''; applySkillFilter(); }
function applySkillFilter() {
  const q = (skillFilter.q || '').trim().toLowerCase();
  document.querySelectorAll('.skill-item').forEach(it => {
    const okQ = !q || (it.getAttribute('data-search') || '').includes(q);
    const okSrc = skillFilter.source === 'all' || it.getAttribute('data-source') === skillFilter.source;
    const okAttn = !skillFilter.attention || it.getAttribute('data-attention') === '1';
    it.style.display = (okQ && okSrc && okAttn) ? '' : 'none';
  });
}

async function replayCallbackDlq() {
  try {
    const r = await fetchJson('/callback/dlq/replay', { method: 'POST' });
    toast(`DLQ replay: ${r.delivered} delivered, ${r.still_failing} still failing`);
    render();
  } catch (e) { alert(`Replay failed: ${e.message}`); }
}

// Upload a self-contained skill as a .zip or a folder. The backend validates
// the bundle, registers the skill (+ any drop-in tools / corpus it ships), and
// optionally wires it to the agents ticked here so it's immediately usable.
async function uploadSkillDialog() {
  const agents = (cachedAgents && cachedAgents.length)
    ? cachedAgents : ((await fetchJson('/agents')).agents || []);
  const agentBoxes = agents.map(a =>
    `<label class="agent-pill"><input type="checkbox" class="us-agent" value="${a.id}"> ${a.id}</label>`
  ).join('') || '<small style="color:#9ca3af">No agents.</small>';
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal" style="max-width:640px">
      <div class="modal-header">
        <h3>Upload a skill</h3>
        <button class="close-btn" onclick="this.closest('.modal-bg').remove()">×</button>
      </div>
      <div class="modal-body">
        <div style="font-size:13px;color:#374151;margin-bottom:14px;line-height:1.5">
          Upload a self-contained skill as a <strong>.zip</strong> or pick its <strong>folder</strong>.
          It is validated, then attached so agents can use it. Expected contents:
          <ul style="margin:8px 0 0 18px">
            <li><strong>skill.json</strong> <em>or</em> <strong>SKILL.md</strong> (required) — <code>id</code>, <code>name</code>, <code>instructions</code>, <code>tool_ids</code>, optional <code>corpus_id</code>. (SKILL.md = YAML frontmatter for the fields + a markdown body that becomes the instructions.)</li>
            <li><strong>tools/*.py</strong> (optional) — drop-in <code>@tool</code> plugins the skill needs</li>
            <li><strong>corpus.jsonl</strong> (optional) — RAG knowledge for the skill</li>
          </ul>
        </div>
        <label>Skill .zip file</label>
        <input id="us-zip" type="file" accept=".zip">
        <div style="text-align:center;color:#9ca3af;font-size:12px;margin:8px 0">— or —</div>
        <label>Skill folder</label>
        <input id="us-dir" type="file" webkitdirectory directory multiple>
        <label style="margin-top:12px">Wire to agents (optional — you can also do this later on this page)</label>
        <div class="agent-grid">${agentBoxes}</div>
        <div id="us-status" style="margin-top:14px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="this.closest('.modal-bg').remove()">Cancel</button>
        <button class="btn btn-primary" id="us-submit">Validate &amp; attach</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  modal.querySelector('#us-submit').addEventListener('click', async () => {
    const zip = modal.querySelector('#us-zip').files[0];
    const dirFiles = modal.querySelector('#us-dir').files;
    const status = modal.querySelector('#us-status');
    if (!zip && (!dirFiles || !dirFiles.length)) {
      return alert('Pick a .zip file or a folder first.');
    }
    if (zip && dirFiles && dirFiles.length) {
      return alert('Pick EITHER a .zip OR a folder, not both.');
    }
    const agentsSel = [...modal.querySelectorAll('.us-agent:checked')].map(c => c.value);
    const fd = new FormData();
    fd.append('uploaded_by', 'admin');
    if (agentsSel.length) fd.append('agents', JSON.stringify(agentsSel));
    if (zip) {
      fd.append('mode', 'zip');
      fd.append('file', zip);
    } else {
      fd.append('mode', 'folder');
      // Preserve each file's relative path so the backend can rebuild the folder.
      for (const f of dirFiles) fd.append('files', f, f.webkitRelativePath || f.name);
    }
    status.innerHTML = '⏳ Uploading &amp; validating…';
    try {

}

// Render a skill as a SKILL.md (frontmatter + body) for the markdown tab.
function _skillToMd(e) {
  const t = (e.tool_ids || []);
  const toolsBlock = t.length ? ('tool_ids:\n' + t.map(x => '  - ' + x).join('\n')) : 'tool_ids: []';
  return `---
id: ${e.id || ''}
name: ${e.name || ''}
description: ${e.description || ''}
${toolsBlock}
corpus_id: "${e.corpus_id || ''}"
enabled: ${e.enabled !== false}
---

${e.instructions || ''}`;
}

async function submitSkill(btn) {
  const modal = btn.closest('.modal-bg');
  // SKILL.md tab active? Save via the markdown endpoint (persists as <id>.md).
  const mdPane = modal.querySelector('#sk-mode-md');
  if (mdPane && mdPane.style.display !== 'none') {
    const markdown = modal.querySelector('#sk-md').value;
    try {
      const r = await fetchJson('/skills/md', {
        method: 'POST', body: JSON.stringify({ markdown, agents: [], overwrite: true }),
      });
      if (r.ok === false) throw new Error((r.errors || []).join('; ') || 'validation failed');
      modal.remove();
      toast(`Saved SKILL.md ${r.skill_id || ''}`);
      if ((r.warnings || []).length) alert('Saved with warnings:\n- ' + r.warnings.join('\n- '));
      renderSkills(document.getElementById('content'));
    } catch (e) { alert(`Save failed: ${e.message}`); }
    return;
  }
  const val = id => modal.querySelector(id).value.trim();
  const toolIds = val('#sk-tools').split(/[,\n]/).map(s => s.trim()).filter(Boolean);
  const body = {
    id: val('#sk-id'), name: val('#sk-name') || val('#sk-id'),
    description: val('#sk-desc'), instructions: val('#sk-instr'),
    tool_ids: toolIds, corpus_id: val('#sk-corpus'),

  };
  if (!body.id) { alert('ID is required'); return; }

    await fetchJson('/skills', { method: 'PUT', body: JSON.stringify(body) });
    modal.remove();

    renderSkills(document.getElementById('content'));
  } catch (e) { alert(`Save failed: ${e.message}`); }
}

// ===== CALLBACK BUILDER (outbound agent: RAG + MCP + skill, no code) =====
// Authors a skill's `outbound` contract and PUTs it to /skills. The backend
// validator (outbound_contract.py) is the guardrail — 400s surface inline.
function _kvToObj(s) {            // "yes:a, no:b" -> {yes:'a', no:'b'}
  const o = {};
  (s || '').split(',').forEach(p => {
    const i = p.indexOf(':'); if (i < 0) return;
    const k = p.slice(0, i).trim(), v = p.slice(i + 1).trim();
    if (k) o[k] = v;
  });
  return o;
}
function _objToKv(o) { return Object.entries(o || {}).map(([k, v]) => `${k}:${v}`).join(', '); }
function _csv(s) { return (s || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean); }

          <div><label class="cbl">Languages (comma)</label><input id="cb-langs" value="${escapeHtml(((ob&&ob.languages)||['hi-IN','en-IN']).join(', '))}" style="width:100%"></div>

function cbLoadTemplate(idx) {
  if (idx === '') return;
  const t = window._cbState.grammar.templates[+idx]; if (!t) return;
  const ob = JSON.parse(JSON.stringify(t.outbound));
  const m = document.querySelector('.modal-bg .modal');
  const set = (id, v) => { const el = m.querySelector(id); if (el) el.value = v; };
  set('#cb-langs', (ob.languages||[]).join(', '));
  set('#cb-gate', (ob.consent_gate||{}).script || '');
  set('#cb-wrong', (ob.consent_gate||{}).on_wrong_person || 'wrong_person');
  set('#cb-gt-tool', (ob.ground_truth||{}).tool || '');
  set('#cb-gt-arg', (ob.ground_truth||{}).arg_key || '');
  set('#cb-outcomes', (ob.terminal_outcomes||[]).join(', '));
  set('#cb-out', Object.keys((ob.output_schema||{}).properties||{}).join(', '));
  set('#cb-tools', (t.outbound.steps||[]).filter(s=>s.tool).map(s=>s.tool)
        .concat((ob.ground_truth||{}).tool?[ob.ground_truth.tool]:[]).join(', '));
  window._cbState.steps = ob.steps || [];
  cbRenderSteps();
}

function cbAddStep() { window._cbState.steps.push({ id: 's' + (window._cbState.steps.length+1), type: 'ask', capture: 'free_text' }); cbRenderSteps(); }
function cbRemoveStep(i) { window._cbState.steps.splice(i, 1); cbRenderSteps(); }
function cbMoveStep(i, d) { const s = window._cbState.steps, j = i + d; if (j<0||j>=s.length) return; [s[i],s[j]]=[s[j],s[i]]; cbRenderSteps(); }
function cbField(i, k, v) { window._cbState.steps[i][k] = v; }
function cbTypeChange(i, t) { const st = window._cbState.steps[i]; st.type = t; if (t==='ask'&&!st.capture) st.capture='free_text'; cbRenderSteps(); }

function cbRenderSteps() {
  const g = window._cbState.grammar;
  const box = document.getElementById('cb-steps'); if (!box) return;
  box.innerHTML = window._cbState.steps.map((s, i) => {
    const typeSel = g.step_types.map(t => `<option ${s.type===t?'selected':''}>${t}</option>`).join('');
    let fields = '';
    if (s.type === 'inform') {
      fields = `<input placeholder="say…" value="${escapeHtml(s.say||'')}" oninput="cbField(${i},'say',this.value)" style="width:100%">`;
    } else if (s.type === 'ask') {
      const capSel = g.capture_types.map(c => `<option ${s.capture===c?'selected':''}>${c}</option>`).join('');
      fields = `<input placeholder="ask…" value="${escapeHtml(s.ask||'')}" oninput="cbField(${i},'ask',this.value)" style="width:100%">
        <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px;margin-top:4px">
          <select onchange="cbField(${i},'capture',this.value)">${capSel}</select>
          <input placeholder="verify_against (e.g. ground_truth.relationship)" value="${escapeHtml(s.verify_against||'')}" oninput="cbField(${i},'verify_against',this.value)">
        </div>
        ${s.capture==='choice'?`<input placeholder="choices (comma)" value="${escapeHtml((s.choices||[]).join(', '))}" oninput="cbField(${i},'choices',this.value.split(',').map(x=>x.trim()).filter(Boolean))" style="width:100%;margin-top:4px">`:''}`;
    } else if (s.type === 'action') {
      fields = `<input placeholder="tool (mcp.…)" value="${escapeHtml(s.tool||'')}" oninput="cbField(${i},'tool',this.value)" style="width:100%">
        <input placeholder="args (key:value, comma)" value="${escapeHtml(_objToKv(s.args))}" oninput="cbField(${i},'args',_kvToObj(this.value))" style="width:100%;margin-top:4px">
        <input placeholder="say after (optional)" value="${escapeHtml(s.say_result||'')}" oninput="cbField(${i},'say_result',this.value)" style="width:100%;margin-top:4px">`;
    } else if (s.type === 'branch') {
      fields = `<input placeholder="on (yes:step_a, no:step_b)" value="${escapeHtml(_objToKv(s.on))}" oninput="cbField(${i},'on',_kvToObj(this.value))" style="width:100%">
        <input placeholder="default_next (optional)" value="${escapeHtml(s.default_next||'')}" oninput="cbField(${i},'default_next',this.value)" style="width:100%;margin-top:4px">`;
    }
    return `<div class="tool-item" style="padding:8px;margin-bottom:6px">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
        <input value="${escapeHtml(s.id||'')}" oninput="cbField(${i},'id',this.value)" placeholder="id" style="width:120px">
        <select onchange="cbTypeChange(${i},this.value)" style="width:110px">${typeSel}</select>
        <input placeholder="next (optional)" value="${escapeHtml(s.next||'')}" oninput="cbField(${i},'next',this.value)" style="width:140px">
        <span style="margin-left:auto"></span>
        <button class="btn btn-secondary btn-sm" onclick="cbMoveStep(${i},-1)">↑</button>
        <button class="btn btn-secondary btn-sm" onclick="cbMoveStep(${i},1)">↓</button>
        <button class="btn btn-danger btn-sm" onclick="cbRemoveStep(${i})">✕</button>
      </div>
      ${fields}
    </div>`;
  }).join('') || '<div class="empty">No steps yet — add one.</div>';
}

async function submitCallback(btn) {
  const m = btn.closest('.modal-bg');
  const v = id => (m.querySelector(id).value || '').trim();
  const errEl = m.querySelector('#cb-err'); errEl.textContent = '';
  // strip empty optional props per step
  const steps = window._cbState.steps.map(s => {
    const o = { id: s.id, type: s.type };
    for (const k of ['say','ask','capture','verify_against','choices','tool','args','say_result','on','default_next','next']) {
      const val = s[k];
      if (val === undefined || val === '' ) continue;
      if (Array.isArray(val) && !val.length) continue;
      if (val && typeof val === 'object' && !Array.isArray(val) && !Object.keys(val).length) continue;
      o[k] = val;
    }
    return o;
  });
  const outProps = {}; _csv(v('#cb-out')).forEach(f => { outProps[f] = {}; });
  if (!outProps.outcome) outProps.outcome = {};
  const gtTool = v('#cb-gt-tool');
  const outbound = {
    channel: v('#cb-channel') || 'voice_outbound',
    languages: _csv(v('#cb-langs')),
    consent_gate: { must_confirm_identity: true, script: v('#cb-gate'), on_wrong_person: v('#cb-wrong') },
    steps,
    output_schema: { type: 'object', properties: outProps },
    terminal_outcomes: _csv(v('#cb-outcomes')),
    retry_policy: { max_attempts: +v('#cb-attempts') || 3, backoff: v('#cb-backoff'), retry_on: _csv(v('#cb-retryon')) },
  };
  if (gtTool) outbound.ground_truth = { tool: gtTool, arg_key: v('#cb-gt-arg') };
  const body = {
    id: v('#cb-id'), name: v('#cb-name') || v('#cb-id'), description: v('#cb-desc'),
    instructions: v('#cb-instr'), tool_ids: _csv(v('#cb-tools')), corpus_id: v('#cb-corpus'),
    default_agents: [], enabled: true, outbound,
  };
  if (!body.id) { errEl.textContent = 'ID is required'; return; }
  try {
    await fetchJson('/skills', { method: 'PUT', body: JSON.stringify(body) });
    m.remove();
    toast(`Saved callback agent ${body.id}`);
    renderSkills(document.getElementById('content'));
  } catch (e) { errEl.textContent = e.message; }  // surfaces the backend validator error
}

      ? `<span class="tag tag-active">key present (${status.key_preview})</span>`

    root.innerHTML = `
      <div class="card">
        <div class="card-header"><h2>Sarvam diagnostics</h2></div>
        <div class="card-body">
          <table style="margin-bottom:14px">
            <tr><th>Setting</th><th>Value</th></tr>
            <tr><td>SARVAM_API_KEY</td><td>${keyState}</td></tr>
            <tr><td>Base URL</td><td><code style="font-size:12px">${escapeHtml(status.base_url || '')}</code></td></tr>
            <tr><td>Chat model</td><td><code style="font-size:12px">${escapeHtml(status.chat_model || '')}</code></td></tr>

          </table>
          ${!status.key_present ? `
            <div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:14px;margin-bottom:14px;">
              <strong>🔔 You're hearing beep sounds because Sarvam is in MOCK mode.</strong>
              <p style="margin-top:8px;font-size:13px;line-height:1.5;color:#78350f;">
                The two-tone chime you hear when previewing voices is the mock fallback — it's
                a programmatically-generated sine wave, not Sarvam Bulbul output. To hear real
                Bulbul voices:
              </p>
              <ol style="margin:8px 0 0 24px;font-size:13px;line-height:1.6;color:#78350f;">
                <li>Get an API key from <a href="https://dashboard.sarvam.ai" target="_blank">dashboard.sarvam.ai</a></li>
                <li>Edit <code>phase5b/.env</code>:  <code>SARVAM_API_KEY=sk_xxxxxxxxxxxx</code></li>
                <li>Save the file</li>
                <li>Stop and restart the backend (<code>Ctrl+C</code>, then <code>run.bat</code>)</li>
                <li>Come back here and click "Run full diagnose" below</li>
              </ol>
            </div>` : ''}
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
            <button class="btn btn-primary" onclick="sarvamDiagnose()">▶ Run full diagnose</button>
            <button class="btn btn-secondary" onclick="sarvamTestSingle('chat')">test Chat</button>
            <button class="btn btn-secondary" onclick="sarvamTestSingle('stt')">test STT</button>
            <button class="btn btn-secondary" onclick="sarvamTestSingle('tts')">test TTS</button>
            <button class="btn btn-secondary" onclick="sarvamTestSingle('translate')">test Translate</button>
            <button class="btn btn-secondary" onclick="sarvamTestSingle('vision')">test Vision</button>
          </div>
          <div id="sarvam-results"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h2>About these checks</h2></div>
        <div class="card-body" style="font-size:13px;color:#6b7280;line-height:1.6;">
          <p>Each check makes a <strong>real API call to Sarvam</strong> (not a mock). When MOCK mode is on (no API key), tests are skipped.</p>
          <ul style="margin:8px 0 0 24px;">
            <li><strong>Chat</strong> — sends "reply with ok" to Sarvam-30B. Verifies auth + chat endpoint.</li>
            <li><strong>STT</strong> — uploads a 1.5-second synthetic WAV (pure tone) to Saaras v3. Verifies endpoint reachability + response shape. Transcript will be near-empty (it's a sine wave) — that's expected.</li>
            <li><strong>TTS</strong> — synthesizes "Hello from Sarvam diagnostics" with Bulbul v3 / shubh / en-IN. Verifies the audio bytes are real (not zero-length).</li>
            <li><strong>Translate</strong> — translates one English line to Tamil via Sarvam-Translate v1.</li>
            <li><strong>Vision</strong> — sends a 1×1 PNG to /vision/extract. Verifies the endpoint exists (won't extract anything useful from a 1×1 image).</li>
          </ul>
        </div>
      </div>`;
  } catch (e) { root.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

async function sarvamDiagnose() {
  const out = document.getElementById('sarvam-results');
  out.innerHTML = '<div class="empty">Running diagnostics… (10-30 seconds in LIVE mode)</div>';
  try {
    const r = await fetch(`${BASE}/api/v1/admin/sarvam/diagnose`).then(x => x.json());
    renderDiagResults(out, r);
  } catch (e) { out.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

async function sarvamTestSingle(kind) {
  const out = document.getElementById('sarvam-results');
  out.innerHTML = `<div class="empty">Testing ${kind}…</div>`;
  try {
    let body = {};
    if (kind === 'tts') body = {voice: 'shubh', language: 'en-IN'};
    const r = await fetch(`${BASE}/api/v1/admin/sarvam/test-${kind}`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    }).then(x => x.json());
    renderDiagResults(out, {checks: [r], overall: r.status === 'pass' ? 'green' : 'red',
                            passed: r.status==='pass'?1:0, failed: r.status==='fail'?1:0,
                            skipped: r.status==='skipped'?1:0,
                            hints: [], key_set: true});
  } catch (e) { out.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

function renderDiagResults(out, r) {
  const overallTag = {green:'tag-active', yellow:'tag-pending', red:'tag-rejected'}[r.overall] || 'tag-mock';
  const summaryColor = {green:'#16a34a', yellow:'#f59e0b', red:'#dc2626'}[r.overall] || '#6b7280';
  out.innerHTML = `
    <div style="background:#fff;border:2px solid ${summaryColor};border-radius:10px;padding:14px;margin-bottom:14px;">
      <strong style="font-size:15px">Overall: <span class="tag ${overallTag}">${r.overall.toUpperCase()}</span></strong>
      <span style="margin-left:12px;color:#6b7280;font-size:13px">
        ${r.passed} passed · ${r.failed} failed · ${r.skipped} skipped
      </span>
    </div>
    ${(r.hints||[]).length ? `
      <div style="background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;padding:12px;margin-bottom:14px;">
        <strong style="font-size:13px;">Hints:</strong>
        <ul style="margin:6px 0 0 20px;font-size:13px;line-height:1.5;color:#1e40af;">
          ${r.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}
        </ul>
      </div>` : ''}
    ${(r.checks||[]).map(c => {
      const emoji = {pass:'✓', fail:'✗', skipped:'—'}[c.status] || '?';
      const color = {pass:'#16a34a', fail:'#dc2626', skipped:'#9ca3af'}[c.status] || '#6b7280';
      return `
        <div style="border-left:4px solid ${color};padding:12px;background:#fff;margin-bottom:10px;border-radius:6px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong style="color:${color}">${emoji} ${escapeHtml(c.name)}</strong>
            <span style="font-size:11px;color:#6b7280;font-family:monospace;">
              ${c.http_status?'HTTP '+c.http_status:''}
              ${c.latency_ms?' · '+c.latency_ms+'ms':''}
              ${c.error_kind?' · '+c.error_kind:''}
            </span>
          </div>
          ${c.message ? `<div style="font-size:12px;color:#374151;margin-top:6px;line-height:1.5;white-space:pre-wrap;">${escapeHtml(c.message)}</div>` : ''}
          ${c.response && Object.keys(c.response).length ? `
            <div class="code" style="margin-top:6px;font-size:11px;">${escapeHtml(JSON.stringify(c.response, null, 2))}</div>` : ''}
        </div>`;
    }).join('')}`;
}

function escapeHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
