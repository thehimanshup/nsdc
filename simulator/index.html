        <input id="pi-${this.id}" type="tel" inputmode="numeric" maxlength="10" placeholder="Mobile number">
      </div>
      <button id="pn-${this.id}" class="btn-next" disabled>NEXT →</button>
      <p class="tos-note">📞 call · 📎 attach a document · 🎤 hold to talk</p>
    </div>`;
  }

  _bindOnboarding() {
    const inp = document.getElementById(`pi-${this.id}`);
    const btn = document.getElementById(`pn-${this.id}`);
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g,'').slice(0,10);
      btn.disabled = inp.value.length !== 10;
    });
    btn.addEventListener('click', async () => {
      if (inp.value.length !== 10) return;
      btn.disabled = true; btn.textContent = '⏳ Connecting…';
      try {
        this.phone = inp.value;
        await this.authInit(this.phone);
        const lbl = document.getElementById(`lbl-${this.id}`);
        const lblText = lbl && lbl.querySelector('.lbl-text');
        if (lblText) lblText.textContent = `+91 ${this.phone}`;
        await this.loadAgents(); this.openWS();
        this.state = 'chatlist'; this.render();
      } catch (e) { btn.disabled = false; btn.textContent = 'NEXT →'; alert('Connection failed: ' + e.message); }
    });
  }

  _tplChatList() {
    const items = this.bots.map(b => this._tplChatItem(b)).join('');
    // Phase 6d — single settings button replaces the two action buttons.
    // The header now shows a brief state chip + a gear that opens a menu
    // with Change state / My Data / About.
    const stateChip = this.stateCode
      ? `<span class="wa-state-chip">${this.stateEmoji||'🇮🇳'} ${this.escHTML(this.stateCode)}</span>`
      : '';
    return `<div class="chatlist-wrap">
      <div class="wa-header">
        <div class="wa-header-left">
          <div class="wa-title">Gov Services ${stateChip}</div>
          <div class="wa-num">${this.phone?'+91 '+this.phone:''}${this.stateName?' · '+this.escHTML(this.stateName):''}</div>
        </div>
        <button class="wa-settings-btn" id="setbtn-${this.id}" title="Settings" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div class="search-wrap"><input type="text" id="srch-${this.id}" placeholder="🔍  Search department"></div>
      <div class="chat-list" id="cl-${this.id}">${items}</div>
    </div>`;
  }

  _tplChatItem(bot) {
    const u = this.unread[bot.id] || 0;
    const pre = this.preview[bot.id] || { text: bot.description || 'Tap to chat', time: '' };
    const hasUnread = u > 0;
    const pin = bot.pinned ? `<span class="pin-badge">📌</span>` : '';
    return `<div class="chat-item" data-bot="${bot.id}">
      <div class="ci-avatar" style="background:${bot.bg}">${bot.emoji}</div>
      <div class="ci-body">
        <div class="ci-row1"><span class="ci-name">${this.escHTML(bot.name)}${pin}</span>
          <span class="ci-time${hasUnread?' has-unread':''}">${this.escHTML(pre.time)}</span></div>
        <div class="ci-row2"><span class="ci-preview">${this.escHTML(pre.text)}</span>
          ${hasUnread?`<span class="unread-pill">${u}</span>`:''}</div>
      </div>
    </div>`;
  }

  _bindChatList() {
    const cl = document.getElementById(`cl-${this.id}`);
    cl.addEventListener('click', e => {
      const item = e.target.closest('.chat-item');
      if (!item) return;
      const bot = this.bots.find(b => b.id === item.dataset.bot);
      if (bot) this.openChat(bot);
    });
    const srch = document.getElementById(`srch-${this.id}`);
    srch.addEventListener('input', () => {
      const q = srch.value.toLowerCase();
      cl.querySelectorAll('.chat-item').forEach(el => {
        const name = el.querySelector('.ci-name').textContent.toLowerCase();
        el.style.display = name.includes(q) ? '' : 'none';
      });
    });
    // Phase 6d — single settings button (replaces Pick state + My Data)
    const setbtn = document.getElementById(`setbtn-${this.id}`);
    if (setbtn) setbtn.addEventListener('click', (e) => {
      e.stopPropagation();
      this._toggleSettingsMenu();
    });
  }

  // PHASE 6d — settings dropdown menu
  _toggleSettingsMenu() {
    const wrap = document.getElementById(`ph-${this.id}`);
    if (!wrap) return;
    // Close if open
    const existing = wrap.querySelector('.wa-settings-menu');
    if (existing) { existing.remove(); wrap.querySelectorAll('.wa-settings-backdrop').forEach(b => b.remove()); return; }

    const stateLabel = this.stateCode
      ? `${this.escHTML(this.stateName||this.stateCode)}${this.stateAutoDetected?' (auto)':''}`
      : 'Not set — tap to pick';

    const backdrop = document.createElement('div');
    backdrop.className = 'wa-settings-backdrop';
    backdrop.addEventListener('click', () => this._toggleSettingsMenu());
    wrap.appendChild(backdrop);

    const menu = document.createElement('div');
    menu.className = 'wa-settings-menu';
    menu.innerHTML = `
      <div class="menu-item" data-act="state">
        <span class="icon">${this.stateEmoji||'🇮🇳'}</span>
        <div>
          <span class="main">Change state</span>
          <span class="sub">${stateLabel}</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="menu-item" data-act="mydata">
        <span class="icon">🔒</span>
        <div>
          <span class="main">My Data</span>
          <span class="sub">DPDP rights · export · erase</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="menu-item" data-act="about">
        <span class="icon">ℹ️</span>
        <div>
          <span class="main">About</span>
          <span class="sub">+91 ${this.escHTML(this.phone||'')} · Government Services</span>
        </div>
      </div>
    `;
    menu.addEventListener('click', (e) => {
      const item = e.target.closest('.menu-item');
      if (!item) return;
      const act = item.dataset.act;
      this._toggleSettingsMenu();   // close
      if (act === 'state') this._showStatePicker();
      else if (act === 'mydata') { this.state = 'mydata'; this.render(); }
      else if (act === 'about') {
        alert(`Government Services Assistant\nCitizen ID: ${this.citizenId||'(none)'}\nState: ${this.stateName||'(unset)'}\nLanguage: ${this.primaryLanguage||'(unset)'}`);
      }
    });
    wrap.appendChild(menu);
  }

  async _showStatePicker() {
    const states = await this.loadStates();
    const wrap = document.getElementById(`ph-${this.id}`);
    const overlay = document.createElement('div');
    overlay.className = 'state-overlay';
    const rows = states.map(s => `
      <div class="state-row" data-code="${this.escHTML(s.code)}">
        <span class="em">${s.emoji||'🇮🇳'}</span>
        <span>${this.escHTML(s.name)}</span>
        <span class="lang-pill">${this.escHTML(s.primary_language)}</span>
        <span class="code">${this.escHTML(s.code)}</span>
      </div>`).join('');
    overlay.innerHTML = `
      <div class="state-modal">
        <h3>Pick your state</h3>
        <div class="sub">${states.length} states + UTs · current: ${this.escHTML(this.stateName||'(none)')}</div>
        ${rows}
      </div>`;
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
      const row = e.target.closest('.state-row');
      if (row) { this.setState(row.dataset.code); overlay.remove(); }
    });
    wrap.appendChild(overlay);
  }

  async _mdLoadSummary() {
    const el = document.getElementById(`md-summary-${this.id}`);
    if (!el || !this.citizenId) return;
    try {
      const j = await this.apiFetch(`/citizen/${this.citizenId}/consents`);

        <div style="font-weight:700;color:#1F3864">+91 ${this.phone}</div>

        <div style="display:flex;gap:18px;margin-top:10px">
          <div><div style="font-size:20px;font-weight:700;color:#075E54">${j.active_count}</div>
               <div style="font-size:10px;color:#6b7280">active consents</div></div>
          <div><div style="font-size:20px;font-weight:700;color:#6b7280">${j.all_count}</div>
               <div style="font-size:10px;color:#6b7280">total ledger entries</div></div>
        </div>`;
    } catch (e) {
      el.innerHTML = `<div style="font-size:12px;color:#991b1b">Could not load: ${this.escHTML(e.message)}</div>`;

  async _mdAction(act) {
    const out = document.getElementById(`md-out-${this.id}`);
    out.innerHTML = `<div style="background:white;border-radius:10px;padding:12px;font-size:12px;color:#6b7280">⏳ Working…</div>`;
    try {
      if (act === 'export') {
        const r = await fetch(`${API}/citizen/${this.citizenId}/export`);
        if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `my-data-${this.citizenId}.zip`; document.body.appendChild(a);
        a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
        out.innerHTML = `<div style="background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:12px;font-size:12px;color:#166534">
          ✅ Downloaded <strong>my-data-${this.citizenId}.zip</strong> (${(blob.size/1024).toFixed(1)} KB).<br>
          Open the ZIP — there's a README inside explaining the structure.
        </div>`;
        return;
      }

      if (act === 'consents') {
        const j = await this.apiFetch(`/citizen/${this.citizenId}/consents`);
        const rows = (j.active.length === 0)
          ? `<div style="font-size:12px;color:#6b7280;padding:10px;text-align:center">No active consents.</div>`
          : j.active.map(c => `
            <div style="border-bottom:1px solid #e5e7eb;padding:10px 0;display:flex;align-items:center;gap:10px">
              <div style="flex:1">
                <div style="font-weight:600;color:#1F3864;font-size:13px">${this.escHTML(c.toolId)}</div>
                <div style="font-size:10px;color:#6b7280;margin-top:2px">${this.escHTML(c.agentId)} · scope <code>${this.escHTML(c.scope)}</code></div>
                <div style="font-size:10px;color:#6b7280">granted ${this.escHTML(c.decidedAt||'')}</div>
              </div>
              <button class="md-revoke" data-grant="${this.escHTML(c.grantId)}" style="background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer">Revoke</button>
            </div>`).join('');
        out.innerHTML = `<div style="background:white;border-radius:10px;padding:12px">
          <div style="font-weight:700;color:#1F3864;margin-bottom:8px">Active consents (${j.active.length})</div>
          ${rows}
          <details style="margin-top:10px"><summary style="cursor:pointer;font-size:11px;color:#6b7280">📜 Full ledger history (${j.all_count} entries)</summary>
            <div style="font-size:10px;color:#6b7280;margin-top:6px;font-family:monospace;max-height:160px;overflow-y:auto">
              ${j.history.slice().reverse().map(h => `<div>[${h.entryNo}] ${h.type} <code>${this.escHTML(h.grantId||h.requestId||'')}</code> ${h.status||''}</div>`).join('')}
            </div>
          </details>
        </div>`;
        out.querySelectorAll('.md-revoke').forEach(b => {
          b.addEventListener('click', async () => {
            const g = b.dataset.grant;
            if (!confirm(`Revoke consent ${g}?`)) return;
            try {
              await this.apiFetch(`/citizen/${this.citizenId}/consents/${g}/revoke`, {method:'POST'});
              this._mdAction('consents');   // refresh
              this._mdLoadSummary();
            } catch (e) { alert(e.message); }
          });
        });
        return;
      }

      if (act === 'audit') {
        const j = await this.apiFetch(`/citizen/${this.citizenId}/audit?limit=50`);
        const rows = (j.entries.length === 0)
          ? `<div style="font-size:12px;color:#6b7280;padding:10px;text-align:center">No audit entries yet.</div>`
          : j.entries.slice().reverse().map(e => `
            <div style="border-bottom:1px solid #f3f4f6;padding:6px 0;font-size:11px;color:#374151">
              <span style="color:#6b7280;font-family:monospace">#${e.entryNo}</span>
              <strong>${this.escHTML(e.action)}</strong>
              <span style="color:#6b7280">${this.escHTML((e.timestamp||'').slice(0,19))}</span>
              ${e.resource && e.resource.toolId ? `<br><span style="color:#9ca3af;margin-left:24px">${this.escHTML(e.resource.toolId)}</span>` : ''}
            </div>`).join('');
        out.innerHTML = `<div style="background:white;border-radius:10px;padding:12px;max-height:340px;overflow-y:auto">
          <div style="font-weight:700;color:#1F3864;margin-bottom:6px">Your audit trail (${j.count})</div>
          <div style="font-size:10px;color:#6b7280;margin-bottom:8px">Every entry is hash-chained and Ed25519-signed.</div>
          ${rows}
        </div>`;
        return;
      }

      if (act === 'correction') {
        const field = prompt('Which field needs correction? (e.g. name, address)', '');
        if (!field) { out.innerHTML = ''; return; }
        const newVal = prompt(`What is the correct value for "${field}"?`, '');
        if (newVal == null) { out.innerHTML = ''; return; }
        const reason = prompt('Reason for correction (optional):', '') || '';
        const j = await this.apiFetch(`/citizen/${this.citizenId}/correction`, {
          method: 'POST',
          body: JSON.stringify({ field, new_value: newVal, reason }),
        });
        out.innerHTML = `<div style="background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:12px;font-size:12px;color:#166534">
          ✅ Correction request <code>${this.escHTML(j.requestId||'-')}</code> submitted to the Data Protection Officer.
          You'll get a status update within 30 working days.
        </div>`;
        return;
      }

      if (act === 'erasure') {
        if (!confirm('Erase all your chat content + uploads?\n\nThis is irreversible.\n\nThe audit trail + consent ledger are retained for legal record-keeping (DPDP §17(3) exemption).')) {
          out.innerHTML = ''; return;
        }
        const reason = prompt('Reason (optional):', '') || '';
        const j = await this.apiFetch(`/citizen/${this.citizenId}/erasure`, {
          method:'POST', body: JSON.stringify({ reason, confirm: true }),
        });
        out.innerHTML = `<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:12px;font-size:12px;color:#991b1b">
          🗑️ Erasure complete. Request id <code>${this.escHTML(j.requestId||'-')}</code>.<br>
          Items erased: ${this.escHTML(JSON.stringify(j.stats||{}))}.<br>
          Audit + consent ledger retained per DPDP §17(3).
        </div>`;
        this._mdLoadSummary();
        return;
      }
    } catch (e) {
      out.innerHTML = `<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:12px;font-size:12px;color:#991b1b">❌ ${this.escHTML(e.message)}</div>`;
    }
  }

  _refreshChatItem(botId) {
    const cl = document.getElementById(`cl-${this.id}`);
    if (!cl) return;
    const bot = this.bots.find(b => b.id === botId); if (!bot) return;
    const old = cl.querySelector(`[data-bot="${botId}"]`); if (!old) return;
    const tmp = document.createElement('div'); tmp.innerHTML = this._tplChatItem(bot);
    const newEl = tmp.firstElementChild;
    newEl.addEventListener('click', () => this.openChat(bot));
    cl.insertBefore(newEl, old); old.remove();
  }

  async openChat(bot) {
    this.curBot = bot;
    this.unread[bot.id] = 0;
    this.state = 'chat';
    try { await this.loadHistory(bot.id); } catch(e) {}
    this.render();
  }

  _tplChat() {
    const bot = this.curBot;
    const msgsHtml = this.msgs[bot.id].map(m => this._tplMsg(m)).join('');
    return `<div class="chat-wrap">
      <div class="chat-header">
        <button class="back-btn" id="bk-${this.id}">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="white"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="ch-avatar" style="background:${bot.bg}">${bot.emoji}</div>
        <div class="ch-info">
          <div class="ch-name">${this.escHTML(bot.name)}</div>
          <div class="ch-status">Government helpdesk · online</div>
        </div>
        <div class="ch-actions">
          <button class="ch-call-btn" id="call-${this.id}" title="Voice call">📞</button>
        </div>
      </div>
      <div class="messages-area" id="ma-${this.id}">
        <div class="date-sep"><span>Today</span></div>
        ${msgsHtml}
      </div>
      <div class="chat-input-area">
      <button class="ib-side-btn" id="att-${this.id}" title="Attach document">📎</button>
        <div class="input-box-wrap">
          <textarea class="chat-textarea" id="tx-${this.id}" placeholder="Type, attach a document, or hold mic…" rows="1"></textarea>
        </div>
        <button class="action-fab" id="fab-${this.id}" data-mode="mic" title="Tap = send · Hold = record voice">
          <svg id="fab-icon-${this.id}" viewBox="0 0 24 24" width="22" height="22" fill="white">
            <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
          </svg>
        </button>
      </div>
    </div>`;
  }

  _tplMsg(msg) {
    if (msg.type === 'tool_result') return this._tplToolResult(msg);
    if (msg.type === 'system_event') return `<div class="msg-bubble system-event" style="white-space:pre-line">${this.escHTML(msg.text)}</div>`;
    if (msg.type === 'voice') return this._tplVoiceMsg(msg);
    if (msg.type === 'media') return this._tplMediaMsg(msg);
    const role = msg.role === 'user' ? 'sent' : 'received';
    const ticks = msg.role === 'user' ? `<span class="msg-ticks">✓✓</span>` : '';
    const langBadge = msg.lang && msg.lang !== 'en-IN' && msg.role === 'agent' ? ` <span class="lang-badge">${msg.lang.replace('-IN','')}</span>` : '';
    const audioBtn = msg.audioUrl ? `<div style="margin-top:4px;border-top:1px solid rgba(0,0,0,0.05);padding-top:4px;">${this._audioPlayButton(msg.audioUrl)}</div>` : '';
    // Phase 6c — citation chips for agent messages
    const cites = (msg.role === 'agent' && msg.extra && Array.isArray(msg.extra.citations))
      ? this._tplCitations(msg.extra) : '';
    return `<div class="msg-bubble ${role}">
      <div class="msg-text">${msg.role === 'user' ? this.escHTML(msg.text) : this.richText(msg.text)}</div>
      ${audioBtn}
      ${cites}
      <div class="msg-meta"><span>${msg.time}</span>${langBadge}${ticks}</div>
    </div>`;
  }

  _tplCitations(extra) {
    const cites = extra.citations || [];
    if (!cites.length) return '';
    const lowConf = extra.ragLowConfidence ? '<span class="cite-low">⚠️ low retrieval confidence</span>' : '';
    return `<div class="cite-strip">
      ${lowConf}
      ${cites.slice(0, 4).map((c, i) => {
        const url = c.sourceUrl ? c.sourceUrl : '';
        const tag = url
          ? `<a class="cite-chip" href="${this.escHTML(url)}" target="_blank" title="${this.escHTML(c.source||'')}">📜 ${this.escHTML(c.title||'source')}${c.lastVerified?` · ${c.lastVerified}`:''}</a>`
          : `<span class="cite-chip" title="${this.escHTML(c.source||'')}">📜 ${this.escHTML(c.title||'source')}${c.lastVerified?` · ${c.lastVerified}`:''}</span>`;
        return tag;
      }).join('')}
    </div>`;
  }

  _tplMediaMsg(msg) {
    const role = msg.role === 'user' ? 'sent' : 'received';
    const ticks = msg.role === 'user' ? `<span class="msg-ticks">✓✓</span>` : '';
    const url = msg.mediaUrl && msg.mediaUrl.startsWith('blob:') ? msg.mediaUrl
              : (msg.mediaUrl ? `${BACKEND_BASE}${msg.mediaUrl}` : '');
    const isImage = (msg.mimeType || '').startsWith('image/') ||
      /\.(png|jpe?g|webp|gif|bmp|heic|heif|tiff?)$/i.test(msg.filename || msg.text || '');
    const preview = isImage
      ? `${url ? `<img class="media-img" src="${url}" alt="${this.escHTML(msg.text)}">` : ''}`
      : `<div class="media-doc">
           <div class="media-doc-icon">📄</div>
           <div class="media-doc-name">${this.escHTML(msg.filename || msg.text || '[document]')}</div>
           ${url ? `<a class="media-doc-link" href="${url}" target="_blank" rel="noopener">Open file</a>` : ''}
         </div>`;
    return `<div class="msg-bubble ${role} media-bubble">
      ${preview}
      <div class="media-caption">${this.escHTML(msg.text)}</div>
      <div class="msg-meta"><span>${msg.time}</span>${ticks}</div>
    </div>`;
  }

  _tplVoiceMsg(msg) {
    const role = msg.role === 'user' ? 'sent' : 'received';
    const ticks = msg.role === 'user' ? `<span class="msg-ticks">✓✓</span>` : '';
    const seed = msg.seed || 0;
    const bars = Array.from({length:22}, (_,i) => {
      const h = 4 + Math.round(Math.abs(Math.sin(i * 0.65 + seed)) * 18);
      return `<span style="height:${h}px"></span>`;
    }).join('');
    const dur = msg.dur || (msg.durationSec ? `0:${String(Math.round(msg.durationSec)).padStart(2,'0')}` : '0:05');
    const audioBtn = msg.audioUrl ? `<button class="voice-play" data-audio="${msg.audioUrl}">▶</button>`
                                  : `<button class="voice-play">▶</button>`;
    const transcript = msg.text && msg.role === 'user'
      ? `<div class="voice-transcript">"${this.escHTML(msg.text)}"</div>` : '';
    return `<div class="msg-bubble ${role}">
      <div class="voice-wrap">${audioBtn}<div class="voice-waveform">${bars}</div><span class="voice-dur">${dur}</span></div>
      ${transcript}
      <div class="msg-meta"><span>${msg.time}</span>${ticks}</div>
    </div>`;
  }

  _tplToolResult(msg) {
    const extra = msg.extra || {};
    const toolId = extra.toolId || 'tool';
    const result = extra.result || {};
    const doc = result.document || {};
    const isVision = toolId === 'vision.extract_document';
    const cardCls = isVision ? 'tool-card vision' : 'tool-card';
    const icon = isVision ? '🔎' : '📄';
    const docType = result.document_type || toolId;
    if (isVision) {
      // Keep OCR available to the agent and store, but do not show the raw
      // document-intelligence card in the simulator output.
      return '';
    }
    if (Object.keys(doc).length) {
      const rows = Object.entries(doc).filter(([k]) => !k.startsWith('is_')).map(([k,v]) =>
        `<div class="tc-row"><span class="tc-key">${this.escHTML(k)}:</span> ${this.escHTML(typeof v==='object'?JSON.stringify(v):String(v))}</div>`
      ).join('');
      const conf = result.confidence ? ` · ${(result.confidence*100).toFixed(0)}%` : '';
      const mock = result.is_mock ? ' (mock)' : '';
      return `<div class="${cardCls}">
        <div class="tc-header">${icon} ${this.escHTML(docType)}${conf}${mock}</div>
        ${rows}
      </div>`;
    }
    if (result.complaint_id) {
      return `<div class="tool-card"><div class="tc-header">✅ Complaint Registered</div>
        <div class="tc-row"><span class="tc-key">id:</span> ${this.escHTML(result.complaint_id)}</div></div>`;
    }
    if (result.grievance_id) {
      return `<div class="tool-card"><div class="tc-header">✅ Grievance Filed</div>
        <div class="tc-row"><span class="tc-key">id:</span> ${this.escHTML(result.grievance_id)}</div></div>`;
    }
    // Phase 6f — record-backed tools (create / track / list / schemes) get a
    // clean card instead of a raw JSON blob.
    if ((toolId === 'records.create' || toolId === 'cmo.create_grievance' ||
         toolId === 'water.register_complaint') && result.record_id) {
      const dup = result.duplicate ? ' (existing case)' : '';
      const desk = result.owner_desk ? `<div class="tc-row"><span class="tc-key">desk:</span> ${this.escHTML(result.owner_desk)}</div>` : '';
      const due = result.sla_due_at ? `<div class="tc-row"><span class="tc-key">SLA due:</span> ${this.escHTML(String(result.sla_due_at).slice(0,10))}</div>` : '';
      return `<div class="tool-card"><div class="tc-header">✅ Registered${dup}</div>
        <div class="tc-row"><span class="tc-key">reference:</span> <b>${this.escHTML(result.record_id)}</b></div>
        ${desk}${due}</div>`;
    }
    if (toolId === 'records.track') {
      const rec = result.record || {};
      const rrid = rec.recordId || rec.record_id;
      if (!result.ok || !rrid) {
        return `<div class="tool-card"><div class="tc-header">🔍 Not found</div>
          <div class="tc-row">${this.escHTML(result.message || 'No record for that reference.')}</div></div>`;
      }
      const lv = rec.level || rec.current_level;
      const lvl = lv ? `<div class="tc-row"><span class="tc-key">level:</span> L${this.escHTML(String(lv))}</div>` : '';
      return `<div class="tool-card"><div class="tc-header">🔍 ${this.escHTML(rrid)}</div>
        <div class="tc-row"><span class="tc-key">status:</span> ${this.escHTML(rec.status || '')}</div>${lvl}</div>`;
    }
    if (toolId === 'records.list_mine' && Array.isArray(result.records)) {
      if (!result.records.length) return `<div class="tool-card"><div class="tc-header">📁 No records yet</div></div>`;
      const rows = result.records.slice(0,8).map(r =>
        `<div class="tc-row"><span class="tc-key">${this.escHTML(r.recordId||r.record_id||'')}</span> ${this.escHTML(r.status||'')}</div>`).join('');
      return `<div class="tool-card"><div class="tc-header">📁 Your records (${result.count})</div>${rows}</div>`;
    }
    if (toolId === 'schemes.search' && Array.isArray(result.schemes)) {
      const rows = result.schemes.slice(0,5).map(s =>
        `<div class="tc-row">📜 ${this.escHTML(s.name||s.scheme_id||'')}</div>`).join('');
      return `<div class="tool-card"><div class="tc-header">Schemes found (${result.count||result.schemes.length})</div>${rows}</div>`;
    }
    if (toolId === 'schemes.apply' && result.record_id) {
      const docs = Array.isArray(result.documents_required) && result.documents_required.length
        ? `<div class="tc-row"><span class="tc-key">documents:</span> ${this.escHTML(result.documents_required.join(', '))}</div>` : '';
      return `<div class="tool-card"><div class="tc-header">✅ Application submitted</div>
        <div class="tc-row"><span class="tc-key">scheme:</span> ${this.escHTML(result.scheme||'')}</div>
        <div class="tc-row"><span class="tc-key">reference:</span> <b>${this.escHTML(result.record_id)}</b></div>${docs}</div>`;
    }
    if (toolId === 'projects.track' && result.project) {
      const p = result.project;
      const pct = (p.percent_complete!=null) ? `<div class="tc-row"><span class="tc-key">progress:</span> ${this.escHTML(String(p.percent_complete))}%</div>` : '';
      return `<div class="tool-card"><div class="tc-header">🚧 ${this.escHTML(p.name||p.project_id||'Project')}</div>
        <div class="tc-row"><span class="tc-key">status:</span> ${this.escHTML(p.status||'')}</div>${pct}</div>`;
    }
    return `<div class="tool-card">${this.escHTML(msg.text)}</div>`;
  }

  _audioPlayButton(url) {
    return `<button class="voice-play" data-audio="${url}" style="vertical-align:middle;">▶</button>
            <span style="font-size:11px;color:#888;margin-left:6px;">Listen to reply</span>`;
  }

  _bindAudioButtons(rootEl) {
    rootEl.querySelectorAll('.voice-play[data-audio]').forEach(btn => {
      if (btn._bound) return; btn._bound = true;
      btn.addEventListener('click', () => {
        const url = btn.dataset.audio; if (!url) return;
        const audio = new Audio(`${BACKEND_BASE}${url}`);
        btn.textContent = '⏸'; audio.play();
        audio.onended = () => btn.textContent = '▶';
      });
    });
  }

  _appendToolResultCard(m) {
    const ma = document.getElementById(`ma-${this.id}`); if (!ma) return;
    const tmp = document.createElement('div');
    const html = this._tplToolResult({type:'tool_result', text:m.text, extra:m.extra}).trim();
    if (!html) return;
    tmp.innerHTML = html;
    while (tmp.firstChild) ma.appendChild(tmp.firstChild);
    ma.scrollTop = ma.scrollHeight;
  }

  _bindChat() {
    const bot = this.curBot;
    const ma = document.getElementById(`ma-${this.id}`);
    const tx = document.getElementById(`tx-${this.id}`);
    const fab = document.getElementById(`fab-${this.id}`);
    const fabI = document.getElementById(`fab-icon-${this.id}`);
    const att = document.getElementById(`att-${this.id}`);
    const callBtn = document.getElementById(`call-${this.id}`);

    if (ma) { ma.scrollTop = ma.scrollHeight; this._bindAudioButtons(ma); }

    const SEND_ICON = `<svg viewBox="0 0 24 24" width="22" height="22" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
    const MIC_ICON = `<svg viewBox="0 0 24 24" width="22" height="22" fill="white"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>`;

    document.getElementById(`bk-${this.id}`).addEventListener('click', () => {
      this.state = 'chatlist'; this.curBot = null; this.render();
    });
    if (callBtn) callBtn.addEventListener('click', () => this.startCall());

    const sendCurrent = async () => {
      const t = tx.value.trim(); if (!t) return;
      tx.value = ''; tx.style.height = 'auto';
      await this.sendText(bot.id, t);
      fab.dataset.mode = 'mic'; fabI.innerHTML = MIC_ICON;
    };
    tx.addEventListener('input', () => {
      tx.style.height = 'auto';
      tx.style.height = Math.min(tx.scrollHeight, 100) + 'px';
      if (tx.value.trim()) { fab.dataset.mode = 'send'; fabI.innerHTML = SEND_ICON; }
      else { fab.dataset.mode = 'mic'; fabI.innerHTML = MIC_ICON; }
    });
    tx.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCurrent(); }
    });

    if (att) att.addEventListener('click', () => this._showAttachMenu(bot));

    let holdTimer = null, holding = false, suppressClick = false;
    const startRecord = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        this.mediaRecorder = new MediaRecorder(stream);
        this.audioChunks = [];
        this.mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) this.audioChunks.push(e.data); };
        this.recordStart = Date.now();
        this.mediaRecorder.start();
        fab.classList.add('recording');
        this._showRecBanner();
      } catch (err) { alert('Mic permission required'); }
    };
    const stopRecord = async () => {
      if (!this.mediaRecorder || this.mediaRecorder.state !== 'recording') {
        fab.classList.remove('recording'); this._hideRecBanner(); return;
      }
      const mr = this.mediaRecorder;
      const stopPromise = new Promise(res => mr.onstop = res);
      mr.stop(); mr.stream.getTracks().forEach(t => t.stop());
      await stopPromise;
      fab.classList.remove('recording'); this._hideRecBanner();
      const dur = (Date.now() - this.recordStart) / 1000;
      if (dur < 0.4) return;
      const rawBlob = new Blob(this.audioChunks, {type: mr.mimeType || 'audio/webm'});
      // Sarvam Saaras rejects webm/opus — convert to 16 kHz mono WAV before upload
      let wavBlob;
      try {
        wavBlob = await blobToWav(rawBlob, 16000);
      } catch (e) {
        this._appendMsgEl({role:'system', type:'system_event',
          text:`Audio conversion failed: ${e.message}`, time:this.now()});
        return;
      }
      await this.sendVoice(bot.id, wavBlob, 'audio/wav', dur);
    };
    fab.addEventListener('mousedown', () => { if (fab.dataset.mode==='send') return;
      holding=false; suppressClick=false;
      holdTimer = setTimeout(()=>{ holding=true; suppressClick=true; startRecord(); }, 280);
    });
    fab.addEventListener('mouseup', async () => { clearTimeout(holdTimer);
      if (holding) { holding=false; await stopRecord(); }
    });
    fab.addEventListener('mouseleave', async () => {
      if (holding) { clearTimeout(holdTimer); holding=false; await stopRecord(); }
    });
    fab.addEventListener('click', () => {
      if (suppressClick) { suppressClick=false; return; }
      if (fab.dataset.mode === 'send') sendCurrent();
    });
    fab.addEventListener('touchstart', (e) => { e.preventDefault();
      if (fab.dataset.mode==='send') return;
      holding=false; suppressClick=false;
      holdTimer = setTimeout(()=>{ holding=true; suppressClick=true; startRecord(); }, 280);
    }, {passive:false});
    fab.addEventListener('touchend', async (e) => { e.preventDefault();
      clearTimeout(holdTimer);
      if (holding) { holding=false; await stopRecord(); }
      else if (fab.dataset.mode==='send' && !suppressClick) sendCurrent();
    }, {passive:false});
  }

  _showAttachMenu(bot) {
    const sc = document.getElementById(`sc-${this.id}`);
    if (!sc) return;
    sc.querySelectorAll('.attach-menu').forEach(x => x.remove());
    const opts = [
      {icon:'🆔', label:'PAN',      bg:'#1565C0', hint:'pan'},
      {icon:'🪪', label:'Aadhaar',  bg:'#E65100', hint:'aadhaar'},
      {icon:'🚗', label:'DL',       bg:'#BF360C', hint:'driving_licence'},
      {icon:'🗳️', label:'Voter ID', bg:'#6A1B9A', hint:'voter_id'},
      {icon:'🌾', label:'Patta',    bg:'#4CAF50', hint:'patta_image'},
      {icon:'🍚', label:'Ration',   bg:'#4E342E', hint:'ration_card_image'},
      {icon:'📷', label:'Photo',    bg:'#e91e63', hint:null},
      {icon:'📄', label:'Auto',     bg:'#3f51b5', hint:'auto'},
    ];
    const menu = document.createElement('div');
    menu.className = 'attach-menu';
    menu.innerHTML = opts.map(o => `
      <button class="attach-opt" data-hint="${o.hint||''}">
        <div class="attach-opt-icon" style="background:${o.bg}20">${o.icon}</div>
        <span>${o.label}</span>
      </button>`).join('');
    menu.addEventListener('click', (e) => {
      const btn = e.target.closest('.attach-opt');
      if (!btn) return;
      const hint = btn.dataset.hint || null;
      menu.remove();
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*,application/pdf,.pdf,.png,.jpg,.jpeg,.webp,.heic,.heif,.tif,.tiff';
      input.onchange = (ev) => {
        const file = ev.target.files[0];
        if (file) this.sendDocument(bot.id, file, hint);
      };
      input.click();
    });
    setTimeout(() => document.addEventListener('click', function h(e){
      if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click',h); }
    }), 100);
    sc.appendChild(menu);
  }

  _appendMsgEl(msg) {
    const ma = document.getElementById(`ma-${this.id}`);
    if (!ma) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = this._tplMsg(msg).trim();
    while (tmp.firstChild) ma.appendChild(tmp.firstChild);
    ma.scrollTop = ma.scrollHeight;
    this._bindAudioButtons(ma);
  }

  _showRecBanner() {
    const sc = document.getElementById(`sc-${this.id}`);
    if (!sc) return;
    sc.querySelectorAll('.rec-banner').forEach(x => x.remove());
    const el = document.createElement('div');
    el.className = 'rec-banner'; el.textContent = '🎙 Recording… release to send';
    sc.appendChild(el);
  }
  _hideRecBanner() { document.querySelectorAll(`#sc-${this.id} .rec-banner`).forEach(x => x.remove()); }

  _showToast(bot, text) {
    const screen = document.getElementById(`ph-${this.id}`).querySelector('.phone-screen');
    screen.querySelectorAll('.notif-toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'notif-toast';
    t.innerHTML = `<div class="toast-icon" style="background:${bot.bg}">${bot.emoji}</div>
      <div class="toast-body"><div class="toast-name">${this.escHTML(bot.name)}</div>
        <div class="toast-msg">${this.escHTML(text)}</div></div>`;
    t.addEventListener('click', () => {
      t.classList.add('hiding'); setTimeout(()=>t.remove(), 300);
      if (this.state !== 'chat') this.openChat(bot);
    });
    screen.appendChild(t);
    setTimeout(() => { if (!t.isConnected) return; t.classList.add('hiding'); setTimeout(()=>t.remove(), 300); }, 4500);
  }
}

let phoneCount = 0;
const phones = {};
function addPhone() {
  phoneCount++;
  const id = phoneCount;
  const hint = document.getElementById('empty-hint');
  if (hint) hint.style.opacity = '0';
  const wrapper = document.createElement('div');
  wrapper.className = 'phone-wrapper';
  wrapper.innerHTML = `<div class="phone-frame" id="ph-${id}"><div class="phone-screen"></div></div>
                       <div class="phone-label" id="lbl-${id}"><span class="lbl-text">Phone #${id}</span><button class="phone-del" title="Remove this profile" onclick="removePhone(${id})">&times;</button></div>`;
  document.getElementById('phones-container').appendChild(wrapper);
  const sim = new PhoneSimulator(id);
  phones[id] = sim;
  sim.render();
  setTimeout(() => wrapper.scrollIntoView({behavior:'smooth', inline:'end', block:'center'}), 100);
}

function removePhone(id) {
  const sim = phones[id];
  const who = (sim && sim.phone) ? `+91 ${sim.phone}` : `Phone #${id}`;
  if (!confirm(`Remove ${who} from the simulator?\n\nThis closes the chat window here. (Stored records on the backend are not deleted.)`)) return;
  if (sim) {
    // Mark destroyed so the WS auto-reconnect handler won't revive it.
    sim._destroyed = true;
    sim.state = 'onboarding';
    try { if (sim.activeCall) sim.endCall(); } catch (e) {}
    if (sim.callTimer) { try { clearInterval(sim.callTimer); } catch (e) {} sim.callTimer = null; }
    try { if (sim._stopCallVAD) sim._stopCallVAD(); } catch (e) {}
    if (sim.ws) {
      try { sim.ws.onclose = null; sim.ws.onmessage = null; sim.ws.onerror = null; sim.ws.close(); } catch (e) {}
      sim.ws = null;
    }
    try { if (sim.mediaRecorder && sim.mediaRecorder.state !== 'inactive') sim.mediaRecorder.stop(); } catch (e) {}
    try { if (sim.callRecorder && sim.callRecorder.state !== 'inactive') sim.callRecorder.stop(); } catch (e) {}
  }
  delete phones[id];
  const frame = document.getElementById(`ph-${id}`);
  const wrap = frame && frame.closest('.phone-wrapper');
  if (wrap) wrap.remove();
  // Bring back the empty-state hint when the last phone is removed.
  if (Object.keys(phones).length === 0) {
    const hint = document.getElementById('empty-hint');
    if (hint) hint.style.opacity = '';
  }
}
setInterval(() => {
  const t = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
  document.querySelectorAll('.status-time').forEach(el => el.textContent = t);
}, 30000);
