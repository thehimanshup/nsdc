# PUBLIC plane — internet-facing, ONLY for Twilio inbound webhooks + the
# audio replies Twilio must fetch. Everything else returns 404.
# ZTNA does NOT carry inbound webhooks, so this narrow public ingress is the
# ONLY part of the system exposed to the internet. Lock it down hard.
# /etc/nginx/sites-available/govapp-webhooks.conf
#
# Prereqs on this vhost:
#   - Real public DNS = PUBLIC_BASE_URL (e.g. webhooks.example.gov.in)
#   - Publicly trusted TLS cert (Let's Encrypt / org CA) — Twilio verifies TLS
#   - App-level Twilio signature validation stays ON (TWILIO_VALIDATE_SIGNATURES=true)

server {
    listen 443 ssl;
    server_name webhooks.example.gov.in;
    ssl_certificate     /etc/letsencrypt/live/webhooks.example.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhooks.example.gov.in/privkey.pem;

    client_max_body_size 16m;                 # inbound WhatsApp media

    # Twilio webhook callbacks (whatsapp | status | voice)
    location /webhooks/twilio/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TTS audio replies Twilio fetches for <Play> in voice TwiML
    location /api/v1/audio/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Optional: outbound WhatsApp media Twilio must fetch. Uncomment if used.
    # location /api/v1/uploads/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    # }

    # Everything else is invisible on the public plane.
    location / { return 404; }
}
