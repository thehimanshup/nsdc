# INTERNAL plane — the ZTNA connector points at this vhost.
# Serves the full app (citizen simulator, /admin, WebSocket streaming).
# Not reachable from the public internet; only the ZTNA connector reaches it.
# /etc/nginx/sites-available/govapp-internal.conf

server {
    listen 443 ssl;
    server_name govservices.internal;        # arbitrary; ZTNA maps the app to this
    ssl_certificate     /etc/ssl/govapp/fullchain.pem;   # internal CA / self-signed OK behind ZTNA
    ssl_certificate_key /etc/ssl/govapp/privkey.pem;

    client_max_body_size 25m;                 # document + audio uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # WebSocket upgrade (streaming replies rely on this)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;              # long LLM streaming responses
        proxy_buffering off;                  # stream tokens through, don't buffer
    }
}
